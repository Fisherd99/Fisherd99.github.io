name = "fisherd-pageview-api"
main = "./pageview-worker.js"
compatibility_date = "2026-09-27"

[vars]
ALLOWED_ORIGINS = "https://fisherd99.github.io"

[observability]
enabled = true

  [observability.logs]
  head_sampling_rate = 1

  [observability.traces]
  enabled = true
  head_sampling_rate = 0.01

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fisherd-pageview-db"
database_id = "9929fe86-780b-4b68-bdb4-25f03526c7ef"
